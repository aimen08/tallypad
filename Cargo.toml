[package]
name = "tallypad"
version = "0.1.3"
edition = "2024"
description = "A notepad calculator for Windows, inspired by Soulver. Built with Rust and GPUI."
license = "MIT"
repository = "https://github.com/aimen08/tallypad"
readme = "README.md"
keywords = ["calculator", "gpui", "notepad", "windows"]
categories = ["gui", "mathematics"]

[dependencies]
gpui = "0.2.2"
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
ureq = "3.5.2"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

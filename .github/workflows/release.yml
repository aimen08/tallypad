name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) to publish a
# release. The in-app updater downloads the `Tallypad.exe` asset.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "v$version" != "${{ steps.tag.outputs.name }}" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.name }} doesn't match Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/tallypad.exe dist/Tallypad.exe
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "Tallypad-${{ steps.tag.outputs.name }}-windows-x64.zip"
          Get-FileHash dist/Tallypad.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  Tallypad.exe" } | Set-Content dist/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Tallypad ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            dist/Tallypad.exe
            dist/SHA256SUMS.txt
            Tallypad-${{ steps.tag.outputs.name }}-windows-x64.zip
